name: MyPy Lint

on:
  pull_request:
    paths:
      - '**.py'

jobs:
  mypy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy
      - name: Analyse code with mypy
        run: | 
          mypy --strict --warn-unreachable --warn-redundant-casts --explicit-package-bases $(git ls-files '*.py')