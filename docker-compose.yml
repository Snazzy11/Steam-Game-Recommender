services:
  db:
    image: postgres:18
    restart: no
    environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: postpass
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: